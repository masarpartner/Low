<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4835"/>
      <stop offset="50%" stop-color="#093A2A"/>
      <stop offset="100%" stop-color="#041B13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE596"/>
      <stop offset="35%" stop-color="#E5BE64"/>
      <stop offset="70%" stop-color="#C59638"/>
      <stop offset="100%" stop-color="#9C6F1E"/>
    </linearGradient>
    <linearGradient id="panFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE596" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C59638" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background container with emerald luxury gradient -->
  <rect width="180" height="180" rx="42" fill="url(#bg)"/>
  <rect width="176" height="176" x="2" y="2" rx="40" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Scales of Justice Group -->
  <g filter="url(#glow)">
    <!-- Central Pillar -->
    <line x1="90" y1="28" x2="90" y2="150" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>

    <!-- Top Finial / Pivot Ring -->
    <circle cx="90" cy="26" r="6" fill="url(#gold)"/>
    <circle cx="90" cy="46" r="5" fill="url(#gold)"/>

    <!-- Base Plate -->
    <line x1="56" y1="150" x2="124" y2="150" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <line x1="68" y1="143" x2="112" y2="143" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>

    <!-- Horizontal Balance Beam -->
    <path d="M 28 58 Q 58 54 90 46 Q 122 54 152 58" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round"/>

    <!-- Left Scale (Pan & Strings) -->
    <path d="M 18 116 L 36 59 L 54 116" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 14 116 C 14 130, 58 130, 58 116 Z" fill="url(#panFill)" stroke="url(#gold)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Right Scale (Pan & Strings) -->
    <path d="M 126 116 L 144 59 L 162 116" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 122 116 C 122 130, 166 130, 166 116 Z" fill="url(#panFill)" stroke="url(#gold)" stroke-width="4.5" stroke-linejoin="round"/>
  </g>
</svg>
